<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hookr</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header class="bar">
    <span class="logo" id="logo" role="img" aria-label="Hookr">hookr</span>
    <span class="source"><span id="source"></span><small id="words"></small></span>
  </header>

  <nav class="formats" aria-labelledby="formats-label">
    <span class="label" id="formats-label">Where's it going tonight?</span>
    <div class="format-tabs" id="formats" role="group" aria-labelledby="formats-label"></div>
    <div class="format-meta"><p id="format-line"></p><div class="platforms" id="platforms" role="group" aria-label="Platform"></div></div>
  </nav>

  <div class="moods" id="moods" role="group" aria-label="Lens"></div>
  <p class="mood-line" id="mood-line"></p>

  <div class="elsewhere" id="elsewhere" role="status" hidden>
    <p id="elsewhere-text"></p>
    <button class="quiet" id="hook-here">Hook this page</button>
  </div>

  <main aria-live="polite">
    <section id="reading" class="reading">
      <p id="reading-line">Finding your best angle…</p>
      <small>Reading every line you wrote.</small>
      <div class="lines" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
    </section>

    <section id="result" class="body" hidden>
      <p class="fit-line" id="fit-line" hidden></p>

      <div class="veil" id="veil" hidden>
        <div class="veil-lines" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
        <button class="quiet" id="reveal">I know the risks, show me anyway</button>
      </div>

      <div id="shown">
        <div class="card" id="card">
          <div class="card-head"><span class="label" id="post-label"></span><span class="count" id="count"></span></div>
          <div class="post" id="post" role="textbox" aria-multiline="true" aria-labelledby="post-label" contenteditable="plaintext-only"></div>
          <ol class="thread" id="thread" aria-labelledby="post-label" hidden></ol>
          <div class="trace" id="trace">
            <span class="trace-label" id="trace-label"></span>
            <mark id="excerpt"></mark> <span class="where" id="where"></span>
          </div>
        </div>
        <p class="voice" id="voice"></p>

        <div class="actions">
          <button class="primary" id="copy">Copy for X</button>
          <button class="quiet" id="again">Try another angle</button>
        </div>
      </div>
    </section>

    <section id="access" class="body access" hidden>
      <form id="access-form">
        <h1>Members only</h1>
        <p>Hookr's invite only while we test it. Pop in the access code the 40 for 40 team sent you and you're in.</p>
        <label class="label" for="code">Access code</label>
        <input id="code" name="code" type="password" autocomplete="off" spellcheck="false" required>
        <p class="note" id="access-note" role="status"></p>
        <div class="actions">
          <button class="primary" type="submit">Let me in</button>
          <button class="quiet" type="button" id="access-back">Back</button>
        </div>
        <button class="link" type="button" id="forget">Forget my code on this browser</button>
        <p class="aside">No code? Ask <a href="mailto:hello@40for40.app">hello@40for40.app</a>.</p>
      </form>
    </section>

    <section id="failed" class="body" hidden>
      <p class="error" id="error"></p>
      <div class="actions">
        <button class="quiet" id="retry">Try again</button>
      </div>
    </section>
  </main>

  <footer class="foot"><span id="promise"></span><button class="link" id="change-code" hidden>Access code</button></footer>

  <script type="module" src="panel.js"></script>
</body>
</html>
