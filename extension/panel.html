<!doctype html>
<html lang="en-GB" data-mood="elegant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hookr</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header class="bar">
    <img src="icons/icon-32.png" alt="">Hookr<span class="source" id="source"></span>
  </header>

  <div class="moods" id="moods" role="group" aria-label="Mood"></div>
  <p class="mood-line" id="mood-line"></p>

  <div class="elsewhere" id="elsewhere" role="status" hidden>
    <p id="elsewhere-text"></p>
    <button class="quiet" id="hook-here">Hook this page</button>
  </div>

  <main aria-live="polite">
    <section id="reading" class="reading">
      <p>Reading your page…</p>
      <small>Looking for the line worth posting.</small>
      <div class="lines" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
    </section>

    <section id="result" class="body" hidden>
      <span class="label" id="post-label">Your post for X</span>
      <div class="post" id="post" role="textbox" aria-multiline="true" aria-labelledby="post-label" contenteditable="plaintext-only"></div>
      <div class="count" id="count"><span><b id="chars">0</b> / 280<span id="over"></span></span><span id="voice"></span></div>

      <div class="trace" id="trace">
        <span class="label" id="trace-label"></span><br>
        <mark id="excerpt"></mark> <span class="where" id="where"></span>
      </div>

      <div class="actions">
        <button class="primary" id="copy">Copy for X</button>
        <button class="quiet" id="again">Another hook</button>
      </div>
    </section>

    <section id="access" class="body access" hidden>
      <form id="access-form">
        <h1>Enter your access code</h1>
        <p>Hookr's invite only while we test it. Paste the code the 40 for 40 team sent you and you're in.</p>
        <label class="label" for="code">Access code</label>
        <input id="code" name="code" type="password" autocomplete="off" spellcheck="false" required>
        <p class="note" id="access-note" role="status"></p>
        <div class="actions">
          <button class="primary" type="submit">Let me in</button>
          <button class="quiet" type="button" id="access-back">Back</button>
        </div>
        <button class="link" type="button" id="forget">Forget my code on this browser</button>
        <p class="aside">No code? Ask <a href="mailto:hello@40for40.app">hello@40for40.app</a>.</p>
      </form>
    </section>

    <section id="failed" class="body" hidden>
      <p class="error" id="error"></p>
      <div class="actions">
        <button class="primary" id="anyway" hidden>Hook it anyway</button>
        <button class="quiet" id="retry">Try again</button>
      </div>
    </section>
  </main>

  <footer class="foot"><span id="words"></span><span id="promise"></span><button class="link" id="change-code" hidden>Access code</button></footer>

  <script type="module" src="panel.js"></script>
</body>
</html>
